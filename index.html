<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台本オートスクロール</title>
<style>
  :root{
    --bg:#111; --panel:#1c1c1e; --line:#333; --text:#eee; --sub:#999;
    --accent:#ff9f0a; --ok:#30d158; --ng:#ff453a; --mark:rgba(255,159,10,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Hiragino Sans",sans-serif;-webkit-user-select:none;user-select:none}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:8px;align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
  button,.btn{font:inherit;font-size:15px;color:var(--text);background:#2c2c2e;border:1px solid #444;
    border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
  button:active{opacity:.7}
  #micBtn{min-width:120px;font-weight:600}
  #micBtn.on{background:var(--ng);border-color:var(--ng)}
  #heard{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    direction:rtl;text-align:left;color:var(--sub);font-size:14px}
  #heard span{direction:ltr;unicode-bidi:plaintext}
  #dot{width:12px;height:12px;border-radius:50%;background:#555;flex:none}
  #dot.listen{background:var(--ok);animation:pulse 1.2s infinite}
  #dot.hit{background:var(--accent)}
  @keyframes pulse{50%{opacity:.35}}
  #view{position:fixed;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #pages{padding:12px 0 60vh}
  .page{position:relative;margin:0 auto 12px;background:#fff;box-shadow:0 2px 10px #000a}
  .page canvas{display:block;width:100%;height:100%}
  .hl{position:absolute;background:var(--mark);border-bottom:3px solid var(--accent);pointer-events:none;
    transition:top .25s,left .25s,width .25s,height .25s}
  #readLine{position:fixed;left:0;width:10px;height:3px;background:var(--accent);z-index:5;pointer-events:none;opacity:.8}
  #empty{max-width:560px;margin:15vh auto;padding:0 20px;line-height:1.8;color:var(--sub)}
  #empty h1{color:var(--text);font-size:22px}
  #empty b{color:var(--text)}
  #panel{position:fixed;right:12px;z-index:11;width:min(340px,calc(100% - 24px));background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:14px;display:none;box-shadow:0 8px 30px #000c}
  #panel.open{display:block}
  #panel label{display:block;margin:10px 0 4px;font-size:14px;color:var(--sub)}
  #panel input[type=range]{width:100%}
  #panel .row{display:flex;gap:8px;align-items:center}
  #testInput{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid #444;background:#000;color:#fff}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
    background:#000d;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}
  #pauseBadge{position:fixed;left:50%;transform:translateX(-50%);z-index:9;background:#444d;color:#fff;
    font-size:13px;padding:4px 12px;border-radius:12px;display:none}
  input[type=file]{display:none}
  .ink{position:absolute;inset:0;width:100%;height:100%}
  body.penmode .ink{touch-action:none}
  #penBtn.on{background:#0a84ff;border-color:#0a84ff}
  #palette{position:fixed;left:12px;z-index:11;display:none;gap:6px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 30px #000c;
    max-width:calc(100% - 24px)}
  #palette.pin{display:flex}
  #fingerBtn.on{background:#0a84ff;border-color:#0a84ff}
  #palette button{padding:8px 12px}
  #palette button.sel{outline:3px solid #0a84ff;outline-offset:-1px}
  .sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;border:1px solid #fff6}
  #dialog{position:fixed;inset:0;z-index:30;background:#0009;display:none;align-items:center;justify-content:center}
  #dialog.open{display:flex}
  #dialog .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(380px,calc(100% - 32px));text-align:center}
  #dialog .box p{margin:0 0 16px;line-height:1.6}
  #dialog .box button{display:block;width:100%;margin-top:10px}
</style>
</head>
<body>
<div id="bar">
  <label class="btn" for="file">📄 PDF</label>
  <input id="file" type="file" accept="application/pdf">
  <button id="micBtn" disabled>🎙 聞き取り開始</button>
  <div id="dot"></div>
  <div id="heard"><span></span></div>
  <button id="penBtn" disabled>✏️ ペン</button>
  <button id="setBtn">⚙︎</button>
</div>

<div id="palette">
  <button data-kind="pen" data-color="#111111"><span class="sw" style="background:#111"></span> 黒</button>
  <button data-kind="pen" data-color="#e53935"><span class="sw" style="background:#e53935"></span> 赤</button>
  <button data-kind="pen" data-color="#1e66f5"><span class="sw" style="background:#1e66f5"></span> 青</button>
  <button data-kind="marker" data-color="#ffd400"><span class="sw" style="background:#ffd400"></span> 蛍光</button>
  <button data-kind="eraser">🧽 消しゴム</button>
  <button id="fingerBtn">☝️ 指で書く</button>
  <button id="undoBtn">↶ 戻す</button>
  <button id="exportBtn">💾 PDFで保存</button>
</div>

<div id="dialog"><div class="box">
  <p id="dialogMsg"></p>
  <button id="shareBtn">📤 共有・「ファイル」に保存</button>
  <button id="dlBtn">⬇️ ダウンロード</button>
  <button id="closeDialog">閉じる</button>
</div></div>

<div id="panel">
  <label>読んでいる行を画面のどこに置くか（上から <span id="lineVal"></span>%）</label>
  <input id="lineRange" type="range" min="10" max="70" step="5">
  <label>照合の厳しさ（低いほど反応しやすく、誤爆も増える）</label>
  <input id="strictRange" type="range" min="20" max="70" step="5">
  <label>文字サイズ（ページ幅）</label>
  <div class="row">
    <button id="zoomOut">－</button><button id="zoomFit">幅に合わせる</button><button id="zoomIn">＋</button>
  </div>
  <label>テスト入力（マイクの代わりに文字で試す）</label>
  <input id="testInput" placeholder="台本の一部を入力して Enter">
  <label id="info" style="margin-top:12px"></label>
</div>

<div id="pauseBadge">手動スクロール中（数秒で自動追従に戻ります）</div>
<div id="readLine"></div>
<div id="view">
  <div id="empty">
    <h1>台本オートスクロール</h1>
    <p>① 左上の <b>📄 PDF</b> から台本を開く<br>
       ② <b>🎙 聞き取り開始</b> を押す<br>
       ③ 現場の声に合わせて、読んでいる場所へ自動でスクロールします</p>
    <p>・ページをタップすると、そこを「いまの位置」にできます<br>
       ・指でスクロールすると、数秒だけ自動追従が止まります<br>
       ・Apple Pencil ならそのまま書き込めます（指で書くときは <b>✏️ ペン</b> →「☝️ 指で書く」）<br>
       ・書き込みは自動で iPad に保存。<b>💾 PDFで保存</b> で書き込み入りの PDF を書き出せます<br>
       ・文字が選択できない PDF（スキャン画像）は照合できません</p>
    <p id="lastPdf" style="display:none"><button id="openLast">前回の台本を開く</button></p>
  </div>
  <div id="pages"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'build/pdf.worker.min.js';

const $ = id => document.getElementById(id);
const view = $('view'), pagesEl = $('pages');

// ---------- 設定（ブラウザに保存） ----------
const settings = Object.assign({ readLine: 30, strict: 30, zoom: 1 }, load('settings') || {});
function load(k){ try { return JSON.parse(localStorage.getItem('daihon_' + k)); } catch(e){ return null; } }
function save(k, v){ try { localStorage.setItem('daihon_' + k, JSON.stringify(v)); } catch(e){} }

// ---------- 状態 ----------
let pdf = null;
let pages = [];        // {div, canvas, hl, w, h, rendered, items:[{x,y,w,h,start,end}]}
let S = '';            // 台本全体を正規化した文字列
let charItem = [];     // S の各文字 → [ページ番号, アイテム番号]
let bigramIndex = new Map();
let cursor = 0;        // S 上の「いま読んでいる位置」
let pageScale = 1;
let manualUntil = 0;   // この時刻までは自動スクロールしない

// ---------- 文字の正規化 ----------
// 全角半角を揃え、カタカナ→ひらがな、記号と空白を除く
function normalize(str){
  let out = '';
  for (const ch of str.normalize('NFKC').toLowerCase()) {
    let c = ch.codePointAt(0);
    if (c >= 0x30A1 && c <= 0x30F6) c -= 0x60;
    const s = String.fromCodePoint(c);
    if (/[\p{L}\p{N}]/u.test(s)) out += s;
  }
  return out;
}

// ---------- PDF 読み込み ----------
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  saveLastPdf(buf.slice(0), f.name);
  openPdf(buf, f.name);
  e.target.value = '';
});

let currentBytes = null; // 書き出し用に元の PDF を残しておく
async function openPdf(buf, name){
  toast('読み込み中…');
  currentBytes = buf.slice(0);
  pdf = await pdfjsLib.getDocument({
    data: buf,
    cMapUrl: PDFJS_BASE + 'cmaps/', cMapPacked: true,
    standardFontDataUrl: PDFJS_BASE + 'standard_fonts/'
  }).promise;

  $('empty').style.display = 'none';
  pagesEl.innerHTML = '';
  pages = []; S = ''; charItem = []; cursor = 0;

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 1 });
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.index = i - 1;
    const canvas = document.createElement('canvas');
    const hl = document.createElement('div');
    hl.className = 'hl'; hl.style.display = 'none';
    const inkCanvas = document.createElement('canvas');
    inkCanvas.className = 'ink';
    div.append(canvas, hl, inkCanvas);
    attachInk(inkCanvas, i - 1);
    pagesEl.append(div);

    const tc = await page.getTextContent();
    const items = [];
    for (const it of tc.items) {
      if (!it.str) continue;
      const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
      const fh = Math.hypot(tx[2], tx[3]) || 10;
      const vertical = tc.styles[it.fontName] && tc.styles[it.fontName].vertical;
      const box = vertical
        ? { x: tx[4] - fh / 2, y: tx[5], w: fh, h: Math.max(it.height, fh) }
        : { x: tx[4], y: tx[5] - fh, w: Math.max(it.width, fh), h: fh };
      const n = normalize(it.str);
      if (!n) continue;
      box.start = S.length;
      S += n;
      for (let k = 0; k < n.length; k++) charItem.push([i - 1, items.length]);
      box.end = S.length;
      items.push(box);
    }
    pages.push({ div, canvas, inkCanvas, hl, w: vp.width, h: vp.height, page, rendered: false, items });
  }

  // 前回の書き込みを読み込む（ファイル名＋サイズで台本を見分ける）
  inkKey = name + ':' + currentBytes.byteLength;
  ink = (await idbGet('ink', inkKey)) || {};
  undoStack = [];
  $('penBtn').disabled = false;

  buildIndex();
  layout();
  $('micBtn').disabled = false;
  $('info').textContent = `${name}：${pdf.numPages}ページ / 文字数 ${S.length}`;
  if (S.length < 20) {
    toast('⚠️ 文字が読み取れません（スキャンPDF？）', 5000);
  } else {
    toast(`${pdf.numPages}ページ 読み込み完了`);
  }
  const saved = load('cursor:' + name);
  if (saved && saved < S.length) setCursor(saved, true);
  currentName = name;
}
let currentName = '';

function buildIndex(){
  bigramIndex = new Map();
  for (let i = 0; i < S.length - 1; i++) {
    const bg = S.substr(i, 2);
    let a = bigramIndex.get(bg);
    if (!a) bigramIndex.set(bg, a = []);
    a.push(i);
  }
}

// ---------- 表示 ----------
function layout(){
  if (!pages.length) return;
  const maxW = pages.reduce((m, p) => Math.max(m, p.w), 0);
  const fitW = Math.min(view.clientWidth - 16, 1400);
  pageScale = fitW / maxW * settings.zoom;
  for (const p of pages) {
    p.div.style.width = p.w * pageScale + 'px';
    p.div.style.height = p.h * pageScale + 'px';
    p.rendered = false;
  }
  observeAll();
  placeHighlight(false);
}

let observer;
function observeAll(){
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => {
    for (const e of entries) {
      const p = pages[e.target.dataset.index];
      if (e.isIntersecting) renderPage(p);
      else if (p.rendered) { // メモリ節約
        p.canvas.width = p.canvas.height = 0;
        p.inkCanvas.width = p.inkCanvas.height = 0;
        p.rendered = false;
      }
    }
  }, { root: view, rootMargin: '150% 0px' });
  pages.forEach(p => observer.observe(p.div));
}

async function renderPage(p){
  if (p.rendered || p.rendering) return;
  p.rendering = true;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = p.page.getViewport({ scale: pageScale * dpr });
  p.canvas.width = vp.width; p.canvas.height = vp.height;
  p.inkCanvas.width = vp.width; p.inkCanvas.height = vp.height;
  drawInk(p);
  try { await p.page.render({ canvasContext: p.canvas.getContext('2d'), viewport: vp }).promise; p.rendered = true; }
  catch(e) { console.warn(e); }
  p.rendering = false;
}

// ---------- 照合（音声 → 台本上の位置） ----------
// 聞こえた文字列の末尾を2文字ずつに区切り、台本のどこに一番まとまって現れるかを投票で探す
function findPosition(heard){
  const q = normalize(heard).slice(-24);
  if (q.length < 3 || !S) return null;
  const m = q.length - 1;
  const strict = settings.strict / 100;

  const tryRange = (from, to, need) => {
    const votes = new Map();
    for (let j = 0; j < m; j++) {
      const list = bigramIndex.get(q.substr(j, 2));
      if (!list) continue;
      for (const p of list) {
        if (p < from || p > to) continue;
        const b = Math.round((p - j) / 4);
        let v = votes.get(b);
        if (!v) votes.set(b, v = { js: new Set(), end: 0 });
        v.js.add(j);
        if (p + 2 > v.end) v.end = p + 2;
      }
    }
    let best = null;
    for (const b of votes.keys()) {
      // 前後のバケットもまとめて数える（表記ゆれで文字数がずれても拾えるように）
      const js = new Set(); let end = 0;
      for (const k of [b - 1, b, b + 1]) {
        const v = votes.get(k);
        if (!v) continue;
        v.js.forEach(j => js.add(j));
        end = Math.max(end, v.end);
      }
      const n = js.size;
      const score = n - Math.abs(end - cursor) / 1000; // 同点なら今の位置に近い方
      if (!best || score > best.score) best = { score, n, end };
    }
    if (best && best.n >= need) return best;
    return null;
  };

  // ① すぐ先（少し前〜250字先）は、少ない一致でも反応して素早く追う
  const near = tryRange(cursor - 30, cursor + 250, Math.max(3, m * strict * 0.5));
  if (near) return near.end;
  // ② 少し広い範囲、③ だめなら台本全体を厳しめに
  const local = tryRange(cursor - 120, cursor + 1500, Math.max(3, m * strict));
  if (local) return local.end;
  const global = tryRange(0, S.length, Math.max(6, m * Math.min(0.9, strict + 0.25)));
  if (global) return global.end;
  return null;
}

function setCursor(pos, instant){
  cursor = Math.max(0, Math.min(pos, S.length - 1));
  placeHighlight(!instant);
  if (currentName) save('cursor:' + currentName, cursor);
}

function placeHighlight(smooth){
  pages.forEach(p => p.hl.style.display = 'none');
  if (!charItem.length) return;
  // cursor は「最後に一致した文字の次」なので、1文字前の行を光らせる
  const [pi, ii] = charItem[Math.max(0, Math.min(cursor - 1, charItem.length - 1))];
  const p = pages[pi], it = lineBox(p.items, ii);
  const s = pageScale;
  Object.assign(p.hl.style, {
    display: 'block', left: (it.x * s - 4) + 'px', top: (it.y * s - 3) + 'px',
    width: (it.w * s + 8) + 'px', height: (it.h * s + 6) + 'px'
  });
  if (!smooth && Date.now() >= manualUntil) scrollToY(scrollTargetFor(cursor), false);
}

// 台本上の位置 pos を「読む行」に置くためのスクロール量
// 行の途中なら、その行と次の行の間をなめらかにつなぐ（プロンプターのように少しずつ流れる）
function scrollTargetFor(pos){
  const N = charItem.length;
  const i = Math.max(0, Math.min(Math.floor(pos) - 1, N - 1));
  const yOf = k => { const [pi, ii] = charItem[k]; return [pi, pages[pi].items[ii].y]; };
  const [pi, y] = yOf(i);
  let start = i, next = i;
  while (start > 0 && i - start < 200) { const [pp, yy] = yOf(start - 1); if (pp !== pi || Math.abs(yy - y) > 2) break; start--; }
  while (next < N - 1 && next - i < 200) { const [pp, yy] = yOf(next + 1); if (pp !== pi || Math.abs(yy - y) > 2) break; next++; }
  let yy = y;
  if (next + 1 < N) {
    const [np, ny] = yOf(next + 1);
    if (np === pi && ny > y) yy = y + (ny - y) * Math.min(1, (pos - 1 - start) / (next + 1 - start));
  }
  return pages[pi].div.offsetTop + yy * pageScale - view.clientHeight * settings.readLine / 100;
}

// ---------- 先読みスクロール ----------
// 認識結果は少し遅れて届くので、直近の読む速さから「今このあたりを読んでいるはず」を予想して、
// 一致を待たずになめらかに先へ進める。外れたら次の一致ですぐ補正される。
let hits = [];            // {t:時刻, pos:位置}
function recordHit(pos){
  const now = performance.now();
  hits.push({ t: now, pos });
  hits = hits.filter(h => now - h.t < 10000);
}
function readingSpeed(){ // 文字/ミリ秒
  if (hits.length < 2) return 0;
  const a = hits[0], b = hits[hits.length - 1];
  if (b.t - a.t < 800 || b.pos <= a.pos) return 0;
  return Math.min((b.pos - a.pos) / (b.t - a.t), 0.02); // 上限 20文字/秒
}
let lastFrame = performance.now();
function followLoop(now){
  requestAnimationFrame(followLoop);
  const dt = Math.min(now - lastFrame, 500); lastFrame = now;
  if (!charItem.length || anim || Date.now() < manualUntil || drawing) return;
  let pos = cursor;
  const last = hits[hits.length - 1];
  if (listening && last && last.pos === cursor) {
    const since = Math.min(performance.now() - last.t, 2500); // 2.5秒以上は先読みしない
    pos = cursor + Math.min(readingSpeed() * since, 30);       // 最大30文字先まで
  }
  const target = Math.max(0, scrollTargetFor(pos));
  const d = target - view.scrollTop;
  if (Math.abs(d) < 0.5) return;
  // 画面のコマ数に関係なく、約0.15秒で目標の6割まで近づく速さ。遠いときは一気に
  view.scrollTop += Math.abs(d) > view.clientHeight * 2 ? d : d * (1 - Math.exp(-dt / 160));
}
requestAnimationFrame(followLoop);

// 同じ高さに並んでいる文字のかたまりをまとめて「1行」として光らせる
function lineBox(items, ii){
  const base = items[ii];
  if (base.h > base.w * 2) return base; // 縦書きはそのまま
  let x1 = base.x, x2 = base.x + base.w, y1 = base.y, y2 = base.y + base.h;
  for (let k = Math.max(0, ii - 40); k < Math.min(items.length, ii + 40); k++) {
    const o = items[k];
    const overlap = Math.min(y2, o.y + o.h) - Math.max(base.y, o.y);
    if (overlap > Math.min(base.h, o.h) * 0.6 && o.h < base.h * 1.6 && o.h > base.h / 1.6) {
      x1 = Math.min(x1, o.x); x2 = Math.max(x2, o.x + o.w);
    }
  }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

let anim = null;
function scrollToY(y, smooth){
  y = Math.max(0, y);
  if (anim) cancelAnimationFrame(anim);
  if (!smooth) { view.scrollTop = y; return; }
  const from = view.scrollTop, d = y - from, t0 = performance.now(), dur = 450;
  if (Math.abs(d) < 2) return;
  programmatic = true;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    view.scrollTop = from + d * (1 - Math.pow(1 - t, 3));
    if (t < 1) anim = requestAnimationFrame(step);
    else { anim = null; programmatic = false; }
  };
  anim = requestAnimationFrame(step);
}
let programmatic = false;

// ---------- 手動操作 ----------
let touchStart = null;
const isStylus = t => t.touchType === 'stylus';
view.addEventListener('touchstart', e => {
  const t = e.touches[0];
  pauseAuto();
  // Apple Pencil・ペンモードのときはスクロールさせずに書き込みへ
  if (pages.length && e.target.classList.contains('ink') && (penMode || [...e.touches].some(isStylus))) {
    e.preventDefault(); touchStart = null; return;
  }
  touchStart = { x: t.clientX, y: t.clientY, time: Date.now() };
}, { passive: false });
view.addEventListener('touchmove', e => {
  if (drawing) e.preventDefault();
}, { passive: false });
view.addEventListener('touchend', e => {
  if (!touchStart || penMode) return;
  const t = e.changedTouches[0];
  const moved = Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y);
  if (moved < 10 && Date.now() - touchStart.time < 400) tapAt(t.clientX, t.clientY);
  touchStart = null;
});
view.addEventListener('wheel', pauseAuto, { passive: true });
view.addEventListener('click', e => { if (!('ontouchstart' in window) && !penMode) tapAt(e.clientX, e.clientY); });

function pauseAuto(){
  if (anim) { cancelAnimationFrame(anim); anim = null; }
  manualUntil = Date.now() + 4000;
  const b = $('pauseBadge');
  b.style.display = 'block';
  clearTimeout(pauseAuto.t);
  pauseAuto.t = setTimeout(() => b.style.display = 'none', 4000);
}

// タップした場所に一番近い文字を「いまの位置」にする
function tapAt(cx, cy){
  const el = document.elementFromPoint(cx, cy);
  const div = el && el.closest('.page');
  if (!div) return;
  const p = pages[div.dataset.index];
  const r = div.getBoundingClientRect();
  const x = (cx - r.left) / pageScale, y = (cy - r.top) / pageScale;
  let best = null, bd = Infinity;
  for (const it of p.items) {
    const dx = Math.max(it.x - x, 0, x - (it.x + it.w));
    const dy = Math.max(it.y - y, 0, y - (it.y + it.h));
    const d = dx * dx + dy * dy * 4;
    if (d < bd) { bd = d; best = it; }
  }
  if (!best) return;
  manualUntil = 0;
  $('pauseBadge').style.display = 'none';
  setCursor(best.start + 1, false);
  toast('ここから追従します');
}

// ---------- 音声認識 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, restartTimer = null;

$('micBtn').addEventListener('click', () => listening ? stopListening() : startListening());

function startListening(){
  if (!SR) { toast('このブラウザは音声認識に対応していません（iPad は Safari で開いてください）', 5000); return; }
  listening = true;
  $('micBtn').textContent = '■ 停止';
  $('micBtn').classList.add('on');
  requestWakeLock();
  startRec();
}

function startRec(){
  rec = new SR();
  rec.lang = 'ja-JP';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onstart = () => $('dot').className = 'listen';
  rec.onresult = e => {
    // 今回のセッションで聞こえた全文（確定＋途中）
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    $('heard').firstElementChild.textContent = txt.slice(-60);
    onHeard(txt);
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      toast('マイクの使用が許可されていません（設定 → Safari → マイク）', 6000);
      stopListening();
    }
  };
  rec.onend = () => {
    $('dot').className = '';
    // iPad は一定時間で勝手に止まるので、聞き取り中なら自動で再開する
    if (listening) restartTimer = setTimeout(() => { try { startRec(); } catch(e) {} }, 0);
  };
  try { rec.start(); } catch(e) { console.warn(e); }
}

function stopListening(){
  listening = false;
  clearTimeout(restartTimer);
  if (rec) { rec.onend = null; try { rec.stop(); } catch(e) {} }
  $('dot').className = '';
  $('micBtn').textContent = '🎙 聞き取り開始';
  $('micBtn').classList.remove('on');
  releaseWakeLock();
}

let lastHeard = '';
function onHeard(txt){
  if (txt === lastHeard) return;
  lastHeard = txt;
  const pos = findPosition(txt);
  if (pos == null) return;
  // 後戻りは少しだけ許す（言い直しなど）。大きく戻るのは全体検索で強く一致したときだけ
  if (pos !== cursor) {
    setCursor(pos, false);
    recordHit(pos);
    $('dot').className = 'hit';
    clearTimeout(onHeard.t);
    onHeard.t = setTimeout(() => $('dot').className = listening ? 'listen' : '', 300);
  }
}

// 画面が消えないようにする
let wakeLock = null;
async function requestWakeLock(){ try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {} }
function releaseWakeLock(){ try { wakeLock && wakeLock.release(); } catch(e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (listening && document.visibilityState === 'visible') requestWakeLock(); });

// ---------- テスト入力 ----------
let testBuf = '';
$('testInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  testBuf += e.target.value;
  $('heard').firstElementChild.textContent = testBuf.slice(-60);
  onHeard(testBuf);
  e.target.value = '';
});

// ---------- 設定パネル ----------
$('setBtn').addEventListener('click', () => $('panel').classList.toggle('open'));
function syncSettingsUI(){
  $('lineRange').value = settings.readLine; $('lineVal').textContent = settings.readLine;
  $('strictRange').value = settings.strict;
  $('readLine').style.top = (view.getBoundingClientRect().top + view.clientHeight * settings.readLine / 100) + 'px';
}
$('lineRange').addEventListener('input', e => { settings.readLine = +e.target.value; save('settings', settings); syncSettingsUI(); placeHighlight(true); });
$('strictRange').addEventListener('input', e => { settings.strict = +e.target.value; save('settings', settings); });
const zoom = z => { settings.zoom = Math.max(0.5, Math.min(3, z)); save('settings', settings); layout(); };
$('zoomIn').onclick = () => zoom(settings.zoom * 1.15);
$('zoomOut').onclick = () => zoom(settings.zoom / 1.15);
$('zoomFit').onclick = () => zoom(1);

function fitView(){
  view.style.top = $('bar').offsetHeight + 'px';
  $('panel').style.top = ($('bar').offsetHeight + 8) + 'px';
  $('pauseBadge').style.top = ($('bar').offsetHeight + 8) + 'px';
  $('palette').style.top = ($('bar').offsetHeight + 8) + 'px';
  syncSettingsUI();
}
let resizeT;
window.addEventListener('resize', () => { fitView(); clearTimeout(resizeT); resizeT = setTimeout(layout, 200); });
fitView();

// ---------- 前回の PDF を端末内に保存（IndexedDB） ----------
let dbPromise = null;
function idb(){
  return dbPromise ||= new Promise((ok, ng) => {
    const r = indexedDB.open('daihon', 2);
    r.onupgradeneeded = () => {
      for (const s of ['pdf', 'ink']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s);
    };
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  });
}
async function idbPut(store, key, val){
  try {
    const db = await idb();
    await new Promise((ok, ng) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(val, key); tx.oncomplete = ok; tx.onerror = () => ng(tx.error); });
    return true;
  } catch(e) { console.warn(e); return false; }
}
async function idbGet(store, key){
  try {
    const db = await idb();
    return await new Promise(ok => { const r = db.transaction(store).objectStore(store).get(key); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
  } catch(e) { return null; }
}
const saveLastPdf = (buf, name) => idbPut('pdf', 'last', { buf, name });
idbGet('pdf', 'last').then(last => {
  if (!last) return;
  $('lastPdf').style.display = 'block';
  $('openLast').textContent = `前回の台本を開く（${last.name}）`;
  $('openLast').onclick = () => openPdf(last.buf.slice(0), last.name);
});

// ---------- 書き込み（ペン） ----------
// 線はページの座標（拡大率1のとき）で持つので、拡大縮小しても位置がずれない
let ink = {};          // ページ番号 → [{ c:色, w:太さ, a:不透明度, pts:[[x,y],…] }]
let inkKey = '';
let undoStack = [];      // 元に戻す用
let penMode = false;   // 指でも書けるモード
let drawing = null;
const tool = Object.assign({ kind: 'pen', color: '#e53935' }, load('tool') || {});
const STYLE = { pen: { w: 1.6, a: 1 }, marker: { w: 12, a: 0.35 } };

function attachInk(cv, pi){
  cv.addEventListener('pointerdown', e => {
    if (!(e.pointerType === 'pen' || penMode)) return; // 指（ペンモード外）はスクロールに任せる
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    pauseAuto();
    const pt = toPage(cv, e);
    if (tool.kind === 'eraser') { drawing = { pi, eraser: true, removed: [] }; eraseAt(pi, pt); return; }
    const st = STYLE[tool.kind];
    drawing = { pi, stroke: { c: tool.color, w: st.w, a: st.a, pts: [pt] } };
    redraw(pi);
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing || drawing.pi !== pi) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const pt = toPage(cv, ev);
      if (drawing.eraser) eraseAt(pi, pt);
      else drawing.stroke.pts.push(pt);
    }
    if (!drawing.eraser) redraw(pi);
  });
  const end = () => {
    if (!drawing || drawing.pi !== pi) return;
    if (drawing.eraser) {
      if (drawing.removed.length) undoStack.push({ pi, removed: drawing.removed });
    } else {
      (ink[pi] ||= []).push(drawing.stroke);
      undoStack.push({ pi, added: drawing.stroke });
    }
    drawing = null;
    redraw(pi);
    saveInk();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}

function toPage(cv, e){
  const r = cv.getBoundingClientRect();
  return [ +((e.clientX - r.left) / pageScale).toFixed(1), +((e.clientY - r.top) / pageScale).toFixed(1) ];
}

// 点 (x,y) と線分 a-b の距離
function segDist(x, y, [ax, ay], [bx, by]){
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
  return Math.hypot(x - ax - t * dx, y - ay - t * dy);
}
function eraseAt(pi, pt){
  // 消しゴムを速く動かしても取りこぼさないよう、前回の位置との間を細かく区切って調べる
  const prev = drawing.last || pt;
  drawing.last = pt;
  const reach = 10 / pageScale;
  const steps = Math.max(1, Math.ceil(Math.hypot(pt[0] - prev[0], pt[1] - prev[1]) / reach));
  for (let k = 1; k <= steps; k++) {
    eraseNear(pi, prev[0] + (pt[0] - prev[0]) * k / steps, prev[1] + (pt[1] - prev[1]) * k / steps, reach);
  }
}
function eraseNear(pi, x, y, reach){
  const list = ink[pi] || [];
  for (let i = list.length - 1; i >= 0; i--) {
    const s = list[i], r = s.w / 2 + reach, P = s.pts;
    let hit = P.length === 1 && Math.hypot(P[0][0] - x, P[0][1] - y) < r;
    for (let j = 1; !hit && j < P.length; j++) hit = segDist(x, y, P[j - 1], P[j]) < r;
    if (hit) {
      drawing.removed.push({ stroke: s, index: i });
      list.splice(i, 1);
    }
  }
  if (drawing.removed.length) redraw(pi);
}

let redrawQueued = new Set();
function redraw(pi){
  if (redrawQueued.has(pi)) return;
  redrawQueued.add(pi);
  requestAnimationFrame(() => { redrawQueued.delete(pi); drawInk(pages[pi]); });
}

function drawInk(p){
  const cv = p.inkCanvas;
  if (!cv.width) return;
  const pi = pages.indexOf(p);
  const ctx = cv.getContext('2d');
  const k = cv.width / p.w;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const strokes = (ink[pi] || []).slice();
  if (drawing && drawing.pi === pi && drawing.stroke) strokes.push(drawing.stroke);
  ctx.lineCap = ctx.lineJoin = 'round';
  for (const s of strokes) {
    ctx.globalAlpha = s.a;
    ctx.strokeStyle = s.c;
    ctx.lineWidth = s.w * k;
    ctx.beginPath();
    s.pts.forEach(([x, y], i) => i ? ctx.lineTo(x * k, y * k) : ctx.moveTo(x * k, y * k));
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] * k + 0.1, s.pts[0][1] * k);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

let saveT;
function saveInk(){
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if (!inkKey) return;
    const ok = await idbPut('ink', inkKey, ink);
    if (!ok) toast('⚠️ 書き込みを保存できませんでした', 4000);
  }, 300);
}

$('undoBtn').onclick = () => {
  const h = undoStack.pop();
  if (!h) { toast('戻せる操作がありません'); return; }
  const list = ink[h.pi] ||= [];
  if (h.added) { const i = list.lastIndexOf(h.added); if (i >= 0) list.splice(i, 1); }
  if (h.removed) for (const r of h.removed.slice().reverse()) list.splice(r.index, 0, r.stroke);
  redraw(h.pi); saveInk();
};

// ✏️ は道具パレットの表示切り替え。Apple Pencil はパレットを閉じていても書ける
$('penBtn').onclick = () => {
  const open = $('palette').classList.toggle('pin');
  $('penBtn').classList.toggle('on', open);
  if (!open && penMode) $('fingerBtn').click();
};
$('fingerBtn').onclick = () => {
  penMode = !penMode;
  document.body.classList.toggle('penmode', penMode);
  $('fingerBtn').classList.toggle('on', penMode);
  toast(penMode ? '指で書けます（スクロールするときはオフに）' : '指はスクロールに戻りました', 2500);
};

function syncPalette(){
  document.querySelectorAll('#palette [data-kind]').forEach(b => {
    b.classList.toggle('sel', b.dataset.kind === tool.kind && (tool.kind === 'eraser' || b.dataset.color === tool.color));
  });
}
document.querySelectorAll('#palette [data-kind]').forEach(b => b.onclick = () => {
  tool.kind = b.dataset.kind;
  if (b.dataset.color) tool.color = b.dataset.color;
  save('tool', tool); syncPalette();
});
syncPalette();

// ---------- 書き込み入り PDF の書き出し ----------
let exported = null;
$('exportBtn').onclick = async () => {
  if (!currentBytes) return;
  toast('PDF を作成中…', 10000);
  try {
    const { PDFDocument, rgb, LineCapStyle, LineJoinStyle } = PDFLib;
    const doc = await PDFDocument.load(currentBytes.slice(0), { ignoreEncryption: true });
    const pgs = doc.getPages();
    let count = 0;
    for (const [pi, strokes] of Object.entries(ink)) {
      const pg = pgs[pi];
      if (!pg || !strokes.length) continue;
      const box = pg.getCropBox();
      for (const s of strokes) {
        const pts = s.pts.length === 1 ? [s.pts[0], [s.pts[0][0] + 0.1, s.pts[0][1]]] : s.pts;
        const d = pts.map(([x, y], i) => (i ? 'L' : 'M') + x + ' ' + y).join(' ');
        const n = parseInt(s.c.slice(1), 16);
        pg.drawSvgPath(d, {
          x: box.x, y: box.y + box.height,
          borderColor: rgb((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255),
          borderWidth: s.w, borderOpacity: s.a,
          borderLineCap: LineCapStyle.Round,
        });
        count++;
      }
    }
    const bytes = await doc.save();
    const fname = currentName.replace(/\.pdf$/i, '') + '_書き込み.pdf';
    exported = new File([bytes], fname, { type: 'application/pdf' });
    toast('', 1);
    $('dialogMsg').textContent = `「${fname}」を作成しました（書き込み ${count} 本）`;
    $('shareBtn').style.display = navigator.canShare && navigator.canShare({ files: [exported] }) ? '' : 'none';
    $('dialog').classList.add('open');
  } catch(e) {
    console.error(e);
    toast('⚠️ 書き出しに失敗しました：' + e.message, 5000);
  }
};
$('shareBtn').onclick = async () => {
  try { await navigator.share({ files: [exported], title: exported.name }); $('dialog').classList.remove('open'); }
  catch(e) { if (e.name !== 'AbortError') toast('共有できませんでした。ダウンロードをお試しください', 4000); }
};
$('dlBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(exported); a.download = exported.name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  $('dialog').classList.remove('open');
};
$('closeDialog').onclick = () => $('dialog').classList.remove('open');

function toast(msg, ms = 2000){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}

// テスト用に外から触れるように
window.__daihon = { findPosition, get cursor(){ return cursor; }, get S(){ return S; }, onHeard };
</script>
